# Release workflow. The version is read from <Version> in common.props (the single source of
# truth); a pushed v* tag must match it (guard step below), but tags do not drive the number.
#
# Routing by channel, derived from the SemVer pre-release suffix in <Version>:
#   - Pre-release (e.g. 0.1.0-preview.1) -> NuGet packages pushed to GitHub Packages only.
#   - Stable      (e.g. 0.1.0)           -> NuGet to NuGet.org.
#
# Triggers: push a v* tag (e.g. v0.1.0 or v0.1.0-preview.1) or use workflow_dispatch. For churny
# pre-release builds prefer workflow_dispatch: no tag, no draft Release, no lockstep check - just
# bump <Version> in common.props, run, and the packages land in GitHub Packages.
#
# npm/Angular packaging (angular/projects/site) is intentionally out of scope for this workflow -
# this pass only publishes the NuGet packages so Dignite.Cloud.SiteService can move off a
# cross-repo relative ProjectReference. Revisit once a consumer actually needs the Angular lib.

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest

    # Both checkouts below land as siblings directly under $GITHUB_WORKSPACE (site/, abp-modules/)
    # rather than the default bare checkout at $GITHUB_WORKSPACE itself, so every `run:` step below
    # can stay written as if it executes from the repository root.
    defaults:
      run:
        working-directory: site

    permissions:
      contents: write # Required by softprops/action-gh-release to create a draft Release
      packages: write # Required to push pre-release NuGet packages to GitHub Packages

    steps:
      - name: Checkout site
        uses: actions/checkout@v5
        with:
          path: site

      # Several Dignite.Site projects (Domain, Common.Application(.Contracts)/HttpApi(.Client),
      # Public.Web, Admin.Application.Contracts, ...) carry relative ProjectReferences into the
      # sibling `abp-modules` repo for FlexFields / FileExplorer - see Dignite.Site.slnx's
      # "/flex-fields/" folder and its "..\..\..\abp-modules\..." paths. A single-repo checkout
      # does not have that directory, so restore/build/pack would fail without this step. Both
      # repos are public, so the default GITHUB_TOKEN is enough to check abp-modules out - no
      # extra secret needed. This tracks abp-modules' default branch, the same moving target local
      # development already builds against.
      - name: Checkout abp-modules (sibling dependency for FlexFields / FileExplorer)
        uses: actions/checkout@v5
        with:
          repository: dignite-projects/abp-modules
          path: abp-modules

      # Fail fast when the tag and common.props <Version> disagree. common.props is the truth
      # source.
      - name: Verify tag and version lockstep
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION=$(sed -n 's/.*<Version>\(.*\)<\/Version>.*/\1/p' common.props | head -n1)
          TAG="${GITHUB_REF#refs/tags/}"
          if [ "v$VERSION" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match <Version>$VERSION</Version> in common.props."
            exit 1
          fi

      # Derive the release channel from the SemVer pre-release suffix in common.props <Version>:
      # a hyphen (0.1.0-preview.1) routes packages to GitHub Packages only; a clean version
      # (0.1.0) is a stable release that goes to NuGet.org. Runs on every trigger.
      - name: Determine release channel
        id: channel
        run: |
          VERSION=$(sed -n 's/.*<Version>\(.*\)<\/Version>.*/\1/p' common.props | head -n1)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" == *-* ]]; then
            echo "channel=preview" >> "$GITHUB_OUTPUT"
            echo "::notice::Version $VERSION is a pre-release -> GitHub Packages only."
          else
            echo "channel=stable" >> "$GITHUB_OUTPUT"
            echo "::notice::Version $VERSION is stable -> NuGet.org."
          fi

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Dignite.Site.slnx

      - name: Build
        run: dotnet build Dignite.Site.slnx --no-restore --configuration Release

      - name: Run domain tests
        run: dotnet test test/Dignite.Site.Domain.Tests/Dignite.Site.Domain.Tests.csproj --no-build --configuration Release --verbosity normal

      - name: Run application tests
        run: dotnet test test/Dignite.Site.Application.Tests/Dignite.Site.Application.Tests.csproj --no-build --configuration Release --verbosity normal

      - name: Run EF Core tests
        run: dotnet test test/Dignite.Site.EntityFrameworkCore.Tests/Dignite.Site.EntityFrameworkCore.Tests.csproj --no-build --configuration Release --verbosity normal

      - name: Run MongoDB tests
        run: dotnet test test/Dignite.Site.MongoDB.Tests/Dignite.Site.MongoDB.Tests.csproj --no-build --configuration Release --verbosity normal

      # Only src/*/*.csproj are packed - NOT `dotnet pack Dignite.Site.slnx`. The slnx also carries
      # the "/flex-fields/" folder (abp-modules' own packable projects, checked out above just so
      # they can be *referenced*) and host/ + test/ (IsPackable=false via common.test.props / the
      # inline override on Dignite.Site.Host.csproj). Packing the whole slnx would re-publish
      # abp-modules' own FlexFields/FileExplorer packages under this release by mistake.
      - name: Pack NuGet packages
        run: |
          mkdir -p artifacts
          for proj in src/*/*.csproj; do
            dotnet pack "$proj" --no-build --configuration Release -o artifacts
          done

      - name: Upload NuGet packages
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: site/artifacts/*.nupkg
          if-no-files-found: error

      # Pre-release builds go to GitHub Packages only (private to the org, authenticated with the
      # workflow's built-in GITHUB_TOKEN). The package's <RepositoryUrl> in common.props links it
      # to dignite-projects/site, which GitHub Packages requires for the push.
      - name: Push to GitHub Packages (pre-release)
        if: steps.channel.outputs.channel == 'preview'
        run: |
          dotnet nuget push artifacts/*.nupkg \
            --api-key "${{ secrets.GITHUB_TOKEN }}" \
            --source https://nuget.pkg.github.com/dignite-projects/index.json \
            --skip-duplicate

      # Stable builds go to the public NuGet.org. Secrets cannot be referenced directly in if:
      # expressions, so inject through env and check in the shell; skip the push when not configured.
      - name: Push to NuGet.org (stable)
        if: steps.channel.outputs.channel == 'stable'
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          if [ -z "$NUGET_API_KEY" ]; then
            echo "::notice::NUGET_API_KEY secret is not configured; skipping NuGet.org push (packages were uploaded as workflow artifacts)."
            exit 0
          fi
          dotnet nuget push artifacts/*.nupkg \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      # Extract this version's section from CHANGELOG.md as the draft release body. The heading
      # line is dropped (the release title already carries the version). Missing section is a
      # warning, not an error: the draft is reviewed by a human who can still write the body.
      - name: Extract release notes from CHANGELOG
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          awk -v ver="$VERSION" '
            /^## \[/ { if (found) exit; if (index($0, "[" ver "]") > 0) found = 1; next }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::warning::CHANGELOG.md has no section for $VERSION; the draft release body will be empty - fill it in before publishing."
          fi

      # Create a draft Release only on tag pushes (workflow_dispatch has no tag context).
      # The body is pre-filled from CHANGELOG.md; review the draft before publishing.
      - name: Create draft GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: ${{ steps.channel.outputs.channel == 'preview' }}
          body_path: site/release-notes.md
          files: site/artifacts/*.nupkg
