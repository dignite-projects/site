<form [formGroup]="formEntity">
  <div formGroupName="configuration">
    <div class="mb-3">
      <label class="form-label" for="siteFileFieldContainerName">
        {{ 'FlexFieldsSite::File:FileContainerName' | abpLocalization }}
      </label>
      <select class="form-select" id="siteFileFieldContainerName" [formControlName]="names.fileContainerName">
        <option value=""></option>
        @for (containerName of containerNames; track containerName) {
          <option [value]="containerName">{{ containerName }}</option>
        }
      </select>
    </div>
    <div class="mb-3">
      <div class="form-check form-check-inline">
        <input
          class="form-check-input"
          type="checkbox"
          [formControlName]="names.uploadFileMultiple"
          id="siteFileFieldUploadFileMultiple"
        />
        <label class="form-check-label" for="siteFileFieldUploadFileMultiple">
          {{ 'FlexFieldsSite::File:UploadFileMultiple' | abpLocalization }}
        </label>
      </div>
    </div>
    <button type="submit" style="display: none" #submitclick></button>
  </div>
</form>
