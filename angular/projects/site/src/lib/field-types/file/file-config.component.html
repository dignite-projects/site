<form [formGroup]="formEntity">
  <div formGroupName="configuration">
    <div class="mb-3">
      <label class="form-label" for="siteFileFieldContainerName">
        {{ 'FlexFieldsSite::File:FileContainerName' | abpLocalization }}
      </label>
      <select class="form-select" id="siteFileFieldContainerName" [formControlName]="names.fileContainerName">
        <option value=""></option>
        @for (containerName of containerNames(); track containerName) {
          <option [value]="containerName">{{ containerName }}</option>
        }
      </select>
    </div>
    <div class="mb-3">
      <div class="form-check form-check-inline">
        <input
          class="form-check-input"
          type="checkbox"
          [formControlName]="names.uploadFileMultiple"
          id="siteFileFieldUploadFileMultiple"
        />
        <label class="form-check-label" for="siteFileFieldUploadFileMultiple">
          {{ 'FlexFieldsSite::File:UploadFileMultiple' | abpLocalization }}
        </label>
      </div>
    </div>
    <div class="mb-3">
      <label class="form-label">{{ 'FlexFieldsSite::File:InputMode' | abpLocalization }}</label>
      <div>
        <div class="form-check form-check-inline">
          <input
            class="form-check-input"
            type="radio"
            [value]="inputModes.Upload"
            [formControlName]="names.inputMode"
            id="siteFileFieldInputModeUpload"
          />
          <label class="form-check-label" for="siteFileFieldInputModeUpload">
            {{ 'FlexFieldsSite::File:InputMode:Upload' | abpLocalization }}
          </label>
        </div>
        <div class="form-check form-check-inline">
          <input
            class="form-check-input"
            type="radio"
            [value]="inputModes.Library"
            [formControlName]="names.inputMode"
            id="siteFileFieldInputModeLibrary"
          />
          <label class="form-check-label" for="siteFileFieldInputModeLibrary">
            {{ 'FlexFieldsSite::File:InputMode:Library' | abpLocalization }}
          </label>
        </div>
      </div>
    </div>
  </div>
</form>
