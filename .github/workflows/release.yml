# Release workflow. The version is read from <Version> in common.props (the single source of
# truth, also the version the Angular library at angular/projects/site must match); a pushed v*
# tag must match it (guard step below), but tags do not drive the number.
#
# Routing by channel, derived from the SemVer pre-release suffix in <Version>:
#   - Pre-release (e.g. 0.1.0-preview.1) -> NuGet + npm packages pushed to GitHub Packages only.
#   - Stable      (e.g. 0.1.0)           -> NuGet to NuGet.org, npm to npmjs (@dignite/ng.site).
#
# GitHub Packages' npm registry requires the package scope to equal the owning org login, so the
# npm package publishes under @dignite-projects/ng.site there - not the public @dignite/ng.site name,
# which is reserved for the real npmjs release. This mirrors abp-modules' own release workflow,
# which is also where @dignite/ng.flex-fields (etc.) now come from for the same reason - see that
# repo's .github/workflows/release.yml.
#
# Triggers: push a v* tag (e.g. v0.1.0 or v0.1.0-preview.1) or use workflow_dispatch. For churny
# pre-release builds prefer workflow_dispatch: no tag, no draft Release, no lockstep check - just
# bump <Version> in common.props (and angular/projects/site/package.json to match), run, and the
# packages land in GitHub Packages.

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest

    # Both checkouts below land as siblings directly under $GITHUB_WORKSPACE (site/, abp-modules/)
    # rather than the default bare checkout at $GITHUB_WORKSPACE itself, so every `run:` step below
    # can stay written as if it executes from the repository root.
    defaults:
      run:
        working-directory: site

    permissions:
      contents: write # Required by softprops/action-gh-release to create a draft Release
      packages: write # Required to push pre-release NuGet/npm packages to GitHub Packages

    # angular/.npmrc references ${GITHUB_TOKEN} to authenticate the @dignite-projects scope against
    # GitHub Packages. As of 10.0.0-rc.16, angular/package.json aliases @dignite/ng.flex-fields (and
    # its -ckeditor/-file-explorer adapters, and @dignite/ng.file-explorer) to
    # "npm:@dignite-projects/<name>@<range>" (see the "Install Angular dependencies" step below for
    # why), which is what actually routes those four through this scope/token - GitHub Packages'
    # npm registry requires the scope to equal the owning org login, so @dignite itself has no
    # registry entry there at all. setup-node's `cache: yarn` reads angular/.npmrc (to prime/verify
    # the cache) before any later step gets a chance to export the token itself, so it has to be a
    # job-level env, not just set on that step. (ci.yml carries the same env: block for the same
    # reason; this comment is the one canonical copy of the reasoning - keep them in sync.)
    #
    # Reading a private package published from a different repository (abp-modules) additionally
    # requires that repository's package settings to grant this repository "Manage Actions access"
    # - a one-time, UI-only grant with no REST API equivalent, done once outside this repo's own
    # config and not re-verifiable from here. This job's packages: write permission below is
    # necessary but not sufficient without that grant.
    #
    # To revert once abp-modules tags a release that mirrors flex-fields (rc.16 or a successor) to
    # public npmjs again: drop the four npm: aliases in angular/package.json's dependencies and
    # resolutions blocks back to plain semver ranges; change check-angular-package-duplicates.mjs's
    # target list in both this file and ci.yml from @dignite-projects back to @dignite; the
    # "Manage Actions access" grant and the packages: read/write permissions can stay (harmless once
    # unused) unless a tighter token scope is wanted later.
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout site
        uses: actions/checkout@v5
        with:
          path: site

      # Several Dignite.Site *.NET* projects (Domain, Common.Application(.Contracts)/HttpApi(.Client),
      # Public.Web, Admin.Application.Contracts, ...) carry relative ProjectReferences into the
      # sibling `abp-modules` repo for FlexFields / FileExplorer - see Dignite.Site.slnx's
      # "/flex-fields/" folder and its "..\..\..\abp-modules\..." paths. A single-repo checkout
      # does not have that directory, so restore/build/pack would fail without it. Both repos are
      # public, so the default GITHUB_TOKEN is enough to check abp-modules out - no extra secret
      # needed. This tracks abp-modules' default branch, the same moving target local development
      # already builds against.
      #
      # The Angular side does NOT need this checkout: angular/package.json resolves FlexFields /
      # FileExplorer as real installed @dignite/* npm dependencies - currently aliased through
      # GitHub Packages, see angular/.npmrc and the "Install Angular dependencies" step below - not
      # local file: paths into this sibling.
      - name: Checkout abp-modules (sibling dependency for FlexFields / FileExplorer)
        uses: actions/checkout@v5
        with:
          repository: dignite-projects/abp-modules
          path: abp-modules

      # Fail fast when the tag and common.props <Version> disagree. common.props is the truth
      # source.
      - name: Verify tag and version lockstep
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION=$(sed -n 's/.*<Version>\(.*\)<\/Version>.*/\1/p' common.props | head -n1)
          TAG="${GITHUB_REF#refs/tags/}"
          if [ "v$VERSION" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match <Version>$VERSION</Version> in common.props."
            exit 1
          fi
          NPM_VERSION=$(node -p "require('./angular/projects/site/package.json').version")
          if [ "$NPM_VERSION" != "$VERSION" ]; then
            echo "::error::npm version $NPM_VERSION (angular/projects/site/package.json) is not in lockstep with common.props $VERSION."
            exit 1
          fi

      # Derive the release channel from the SemVer pre-release suffix in common.props <Version>:
      # a hyphen (0.1.0-preview.1) routes packages to GitHub Packages only; a clean version
      # (0.1.0) is a stable release that goes to NuGet.org / npmjs. Runs on every trigger.
      - name: Determine release channel
        id: channel
        run: |
          VERSION=$(sed -n 's/.*<Version>\(.*\)<\/Version>.*/\1/p' common.props | head -n1)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" == *-* ]]; then
            echo "channel=preview" >> "$GITHUB_OUTPUT"
            echo "npm-tag=next" >> "$GITHUB_OUTPUT"
            echo "::notice::Version $VERSION is a pre-release -> GitHub Packages only."
          else
            echo "channel=stable" >> "$GITHUB_OUTPUT"
            echo "npm-tag=latest" >> "$GITHUB_OUTPUT"
            echo "::notice::Version $VERSION is stable -> NuGet.org / npmjs."
          fi

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Dignite.Site.slnx

      - name: Build
        run: dotnet build Dignite.Site.slnx --no-restore --configuration Release

      - name: Run domain tests
        run: dotnet test test/Dignite.Site.Domain.Tests/Dignite.Site.Domain.Tests.csproj --no-build --configuration Release --verbosity normal

      - name: Run application tests
        run: dotnet test test/Dignite.Site.Application.Tests/Dignite.Site.Application.Tests.csproj --no-build --configuration Release --verbosity normal

      - name: Run EF Core tests
        run: dotnet test test/Dignite.Site.EntityFrameworkCore.Tests/Dignite.Site.EntityFrameworkCore.Tests.csproj --no-build --configuration Release --verbosity normal

      - name: Run MongoDB tests
        run: dotnet test test/Dignite.Site.MongoDB.Tests/Dignite.Site.MongoDB.Tests.csproj --no-build --configuration Release --verbosity normal

      # Includes StaticClientProxyRegistrationTests / ClientProxyCoverageTests, the regression lock
      # for the AddHttpClientProxies -> AddStaticHttpClientProxies switch (0.1.0-preview.4) - without
      # this step they only ran when someone happened to run them locally.
      - name: Run HttpApi.Client tests
        run: dotnet test test/Dignite.Site.Public.HttpApi.Client.Tests/Dignite.Site.Public.HttpApi.Client.Tests.csproj --no-build --configuration Release --verbosity normal

      # Only src/*/*.csproj are packed - NOT `dotnet pack Dignite.Site.slnx`. The slnx also carries
      # the "/flex-fields/" folder (abp-modules' own packable projects, checked out above just so
      # they can be *referenced*) and host/ + test/ (IsPackable=false via common.test.props / the
      # inline override on Dignite.Site.Host.csproj). Packing the whole slnx would re-publish
      # abp-modules' own FlexFields/FileExplorer packages under this release by mistake.
      - name: Pack NuGet packages
        run: |
          mkdir -p artifacts
          for proj in src/*/*.csproj; do
            dotnet pack "$proj" --no-build --configuration Release -o artifacts
          done

      - name: Upload NuGet packages
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: site/artifacts/*.nupkg
          if-no-files-found: error

      # Restores every packed .nupkg in an isolated scratch project against the same sources a
      # real consumer sees (this artifacts/ folder + GitHub Packages + nuget.org), so an
      # unresolvable transitive dependency - e.g. a cross-repo abp-modules ProjectReference pinned
      # to a version that was never published, the exact NU1102 failure documented in
      # CHANGELOG.md's 0.1.0-preview.3 entry - fails this workflow instead of a downstream
      # consumer's restore. Runs for both channels: a broken transitive dependency breaks a stable
      # release exactly the same way it breaks a preview one.
      #
      # Uses PACKAGES_READ_TOKEN (a PAT scoped to read:packages only), not secrets.GITHUB_TOKEN:
      # GITHUB_TOKEN can restore this repo's own packages but 403s reading GitHub Packages NuGet
      # feeds published by a *different* repository (abp-modules) - confirmed against the actual
      # endpoint, a repo-scope-only token gets 403, a read:packages-scope token gets 200.
      # GITHUB_TOKEN's package access is documented as scoped to "the workflow repository" only; it
      # doesn't extend cross-repo the way it happens to for this workflow's npm install step.
      - name: Verify packed NuGet packages restore cleanly
        run: |
          bash .github/scripts/verify-packed-nuget-restore.sh artifacts '${{ steps.channel.outputs.version }}' '${{ github.actor }}' '${{ secrets.PACKAGES_READ_TOKEN }}'

      # Pre-release builds go to GitHub Packages only (private to the org, authenticated with the
      # workflow's built-in GITHUB_TOKEN). The package's <RepositoryUrl> in common.props links it
      # to dignite-projects/site, which GitHub Packages requires for the push.
      - name: Push to GitHub Packages (pre-release)
        if: steps.channel.outputs.channel == 'preview'
        run: |
          dotnet nuget push artifacts/*.nupkg \
            --api-key "${{ secrets.GITHUB_TOKEN }}" \
            --source https://nuget.pkg.github.com/dignite-projects/index.json \
            --skip-duplicate

      # Stable builds go to the public NuGet.org. Secrets cannot be referenced directly in if:
      # expressions, so inject through env and check in the shell; skip the push when not configured.
      - name: Push to NuGet.org (stable)
        if: steps.channel.outputs.channel == 'stable'
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          if [ -z "$NUGET_API_KEY" ]; then
            echo "::notice::NUGET_API_KEY secret is not configured; skipping NuGet.org push (packages were uploaded as workflow artifacts)."
            exit 0
          fi
          dotnet nuget push artifacts/*.nupkg \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      # registry-url is deliberately NOT set here, and moved onto a second setup-node call further
      # down (see "Configure npm registry for publishing"). actions/setup-node writes an
      # //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN} placeholder into a generated .npmrc
      # whenever registry-url is given, and that file stays active for every later step in the job.
      # Yarn Classic eagerly substitutes every env-var placeholder in its resolved config on every
      # invocation - not just registry-touching ones - and throws when one is unset. Nothing sets
      # NODE_AUTH_TOKEN until the npmjs publish step at the very end. abp-modules hit exactly this
      # and fixed it the same way; see its CHANGELOG entry for the two false starts before that.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: yarn
          cache-dependency-path: site/angular/yarn.lock

      # angular/.npmrc maps the @dignite-projects scope to GitHub Packages; ${GITHUB_TOKEN} in that
      # file is a literal env-var placeholder npm/yarn substitute at read time, so it has to be
      # present in the environment here (it is, job-level - see the env: block above).
      #
      # Yarn with the committed lockfile, matching ci.yml and every developer machine. This step
      # used to be `npm install --no-package-lock` because Yarn Classic fetches a dependency whose
      # lockfile entry carries a GitHub Packages "resolved" URL through a code path that never
      # attaches registry auth. That was fixed, and for a while every @dignite/* package resolved
      # from public npmjs instead - but as of 10.0.0-rc.16, @dignite/* aliases back onto GitHub
      # Packages (see the job-level env: block's comment), so this step is exercising that auth
      # path again. --legacy-peer-deps is gone with npm: Yarn Classic does not enforce peer ranges,
      # which is what that flag was working around (@swimlane/ngx-datatable@22 wants
      # @angular/common 18-20.x, workspace is on 21.2.x).
      #
      # It also matters for the duplicate check below: npm dedupes graphs that Yarn Classic splits
      # into nested copies, so that check after an npm install would pass vacuously.
      - name: Install Angular dependencies
        working-directory: site/angular
        run: yarn install --frozen-lockfile --non-interactive

      # Two copies of one Angular library are two sets of module-scoped InjectionToken values, so a
      # provider registered against one is invisible to a consumer of the other - the field type is
      # absent at runtime, with nothing failing at install or build time. See the script header and
      # dignite-projects/abp-modules#211.
      #
      # The target list must stay identical to ci.yml's; that file's copy of this step carries the
      # reasoning for what is in it and what was deliberately left out.
      - name: Check for duplicate Angular packages
        working-directory: site/angular
        run: |
          node ../.github/scripts/check-angular-package-duplicates.mjs node_modules \
            @dignite-projects @abp ng-zorro-antd \
            @angular/core @angular/common @angular/forms @angular/router @angular/cdk

      # No lint step here: `ng lint site` currently fails on ~14 pre-existing violations (component
      # selector prefixes, ngIf vs. control-flow syntax) - a real fix, not release-infra, and left
      # alone for now. abp-modules' own release.yml has a similar gap (no lint step for its
      # `notifications` Angular library).
      - name: Run site Angular library unit tests
        working-directory: site/angular
        run: yarn ng test site --watch=false

      - name: Build site Angular library
        working-directory: site/angular
        run: yarn build:site

      # Two checks over the built dist/site manifest: (1) every emitted bare specifier is declared -
      # ng-packagr emits an external for each one it does not bundle but never checks the external is
      # declared, and the verify script below cannot see it either once the package brings its own
      # dependencies; (2) every non-optional peer required across dist/site's transitive
      # `dependencies` closure is either inside that closure or in dist/site's own
      # `peerDependencies`, because consumers install with --legacy-peer-deps and npm then installs
      # no peers at any depth. ci.yml's copy of this step carries the longer account, including the
      # 0.1.0-preview.10 failure check 2 exists for.
      #
      # Both are static reads of the manifest and the installed tree, so they run before the pack -
      # cheaper and more specific than the packed install/bundle gate further down, which is what
      # actually proves the result resolves end to end. Keeping both matters: this one names the
      # offending package and the peer it wants, where the bundle failure only says which specifier
      # could not be resolved.
      - name: Check site Angular package dependencies
        working-directory: site/angular
        run: node ../.github/scripts/check-angular-package-deps.mjs dist/site

      - name: Pack site Angular library
        working-directory: site/angular
        run: |
          mkdir -p ../artifacts/npm/site
          npm pack ./dist/site --pack-destination ../artifacts/npm/site

      - name: Upload npm package
        uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: site/artifacts/npm/site/*.tgz
          if-no-files-found: error

      # The release gate for the npm side, and the npm counterpart of "Verify packed NuGet packages
      # restore cleanly" above - same position in the pipeline, for the same reason: it runs on the
      # local tarball, *before* any publish step, so a package whose import graph does not resolve
      # never reaches a registry.
      #
      # It used to run only after the publish (see the `published` step further down, which is now
      # the second half of this pair). 0.1.0-preview.10 is why that was not good enough: it failed
      # the bundle check with `Could not resolve "@abp/ng.components/tree"` from
      # @dignite/ng.flex-fields, and printed "Do not publish this as the released version" about a
      # package that was already on GitHub Packages under the `latest` dist-tag - and, being the
      # first version ever published under that package name, `latest` had no earlier release to
      # fall back to.
      #
      # Runs for both channels, like the NuGet gate: a package that does not resolve breaks a stable
      # release exactly the way it breaks a preview one. Placed before "Configure npm registry for
      # publishing" as well, so the plain npm install it runs is not subject to the
      # ${NODE_AUTH_TOKEN} placeholder that step writes into $NPM_CONFIG_USERCONFIG.
      #
      # The trailing GITHUB_TOKEN argument is what lets this resolve @dignite/ng.flex-fields (etc.)
      # while flex-fields stays GitHub-Packages-only, per the script's own header comment - without
      # it, this step 404s the moment angular/projects/site/package.json names a flex-fields version
      # that has no public-npmjs entry, which is exactly the gap 10.0.0-rc.16 exposed.
      - name: Verify packed npm package installs and bundles cleanly
        run: bash .github/scripts/verify-packed-npm-install.sh packed artifacts/npm/site '${{ secrets.GITHUB_TOKEN }}'

      # registry-url lives here rather than on the earlier Setup Node.js step - see that step's
      # comment for why no yarn command may run after it. It still has to run *before* the two
      # publish steps below: it is what writes $NPM_CONFIG_USERCONFIG, the file the GitHub Packages
      # step appends its own auth to and the npmjs step reads. Deliberately no `cache: yarn` here -
      # that input makes setup-node probe `yarn cache dir`, which is itself a yarn invocation and
      # would hit the very placeholder this placement exists to avoid. The earlier step already
      # primed the cache.
      - name: Configure npm registry for publishing
        uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          registry-url: 'https://registry.npmjs.org'

      # npm equivalent of the GH Packages NuGet mirror above, and the same rename-in-a-scratch-copy
      # trick abp-modules' release.yml uses: GitHub Packages' npm registry rejects any scope that
      # doesn't match the owning org login, so @dignite/ng.site can't be pushed there under its real
      # name - only npmjs (tagged releases, below) can carry the public @dignite/* scope. The
      # auth token has to be appended to $NPM_CONFIG_USERCONFIG specifically - that's the file
      # setup-node's registry-url input points npm at for the rest of the job; a plain ~/.npmrc is
      # silently ignored (this bit us once already in abp-modules' own release.yml).
      #
      # Every @dignite/* dependency (currently just ng.flex-fields) needs the same scope swap: the
      # packed package.json still names it "@dignite/ng.flex-fields", the public npmjs name that
      # only exists once the stable release ships there - pre-release, only @dignite-projects/*
      # does. Rewritten to the npm alias form ("@dignite/ng.flex-fields":
      # "npm:@dignite-projects/ng.flex-fields@<range>") rather than a plain key rename, so the
      # dependency is still installed under the name the compiled bundle's bare-specifier imports
      # expect, while actually resolving from @dignite-projects on GitHub Packages -
      # angular/package.json uses the identical alias trick for this workspace's own Host app.
      - name: Publish pre-release Angular package to GitHub Packages
        if: steps.channel.outputs.channel == 'preview'
        run: |
          echo "@dignite-projects:registry=https://npm.pkg.github.com" >> "$NPM_CONFIG_USERCONFIG"
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}" >> "$NPM_CONFIG_USERCONFIG"
          tarball=$(ls artifacts/npm/site/*.tgz)
          workdir=$(mktemp -d)
          tar -xzf "$tarball" -C "$workdir"
          npm pkg set name="@dignite-projects/ng.site" --prefix "$workdir/package"
          PKG_DIR="$workdir/package" node -e '
            const fs = require("fs");
            const path = require("path");
            const pkgPath = path.join(process.env.PKG_DIR, "package.json");
            const pkg = JSON.parse(fs.readFileSync(pkgPath, "utf8"));
            for (const [name, range] of Object.entries(pkg.dependencies || {})) {
              if (name.startsWith("@dignite/")) {
                pkg.dependencies[name] = `npm:@dignite-projects/${name.slice("@dignite/".length)}@${range}`;
              }
            }
            fs.writeFileSync(pkgPath, JSON.stringify(pkg, null, 2) + "\n");
          '
          # npm publish has no --skip-duplicate equivalent (unlike the dotnet nuget push calls
          # above); re-dispatching at an unchanged pre-release version is expected and shouldn't
          # fail the run, so treat "already published" as a soft skip and let anything else fail.
          #
          # Redirect rather than `| tee`: the step shell is `bash -e` with no pipefail, so a
          # pipeline's status is tee's (always 0). `if ! npm publish ... | tee` therefore never
          # sees a failure, and this step reported success over an E401. The same bug
          # dignite-projects/vault-extract's release workflow shipped before it fixed this.
          #
          # --tag is not optional: npm errors out on a prerelease version whose dist-tag is left
          # at its default ("You must specify a tag using --tag when publishing a prerelease
          # version" - npm/cli checks whether the tag was set at all, not what it was set to).
          # "latest" is the right value here even though the version is a prerelease, and is why
          # this does not reuse steps.channel.outputs.npm-tag ("next" on this branch): GitHub
          # Packages only ever receives pre-releases - stable goes to npmjs under the public
          # @dignite/* name - so latest tracking the newest preview is what a consumer of this
          # channel wants, it keeps an unpinned install resolving, and it stops the latest tag
          # earlier untagged publishes already set from freezing on a stale preview.
          set +e
          npm publish "$workdir/package" --registry https://npm.pkg.github.com --tag latest > /tmp/npm-publish.log 2>&1
          status=$?
          set -e
          cat /tmp/npm-publish.log
          if [ $status -ne 0 ]; then
            if grep -q 'Cannot publish over existing version' /tmp/npm-publish.log; then
              echo "::notice::@dignite-projects/ng.site@${{ steps.channel.outputs.version }} is already published; skipping."
            else
              exit $status
            fi
          fi

      # Second half of the pair whose first half is the packed gate above. Not redundant with it:
      # the publish step just rewrote the package - renamed to @dignite-projects/ng.site, every
      # @dignite/* dependency turned into an `npm:@dignite-projects/...@<range>` alias - and that
      # rewrite is itself something that can be wrong. Nothing before the publish can exercise it,
      # so this installs what a real consumer of the pre-release channel actually gets, under the
      # names it actually carries. It can no longer stop a bad package from being published (that is
      # the gate's job now); what it still catches is a broken rename, and a registry that did not
      # end up serving what was pushed to it.
      - name: Verify published npm package installs and bundles cleanly
        if: steps.channel.outputs.channel == 'preview'
        run: bash .github/scripts/verify-packed-npm-install.sh published '${{ steps.channel.outputs.version }}' '${{ secrets.GITHUB_TOKEN }}'

      # Stable builds go to the public npmjs, under the real @dignite/ng.site name. Same
      # skip-when-not-configured pattern as the NuGet.org push above.
      - name: Publish to npm (stable)
        if: steps.channel.outputs.channel == 'stable'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::notice::NPM_TOKEN secret is not configured; skipping npm publish (package was uploaded as a workflow artifact)."
            exit 0
          fi
          npm publish artifacts/npm/site/*.tgz \
            --access public \
            --tag '${{ steps.channel.outputs.npm-tag }}'

      # Extract this version's section from CHANGELOG.md as the draft release body. The heading
      # line is dropped (the release title already carries the version). Missing section is a
      # warning, not an error: the draft is reviewed by a human who can still write the body.
      - name: Extract release notes from CHANGELOG
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          awk -v ver="$VERSION" '
            /^## \[/ { if (found) exit; if (index($0, "[" ver "]") > 0) found = 1; next }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::warning::CHANGELOG.md has no section for $VERSION; the draft release body will be empty - fill it in before publishing."
          fi

      # Create a draft Release only on tag pushes (workflow_dispatch has no tag context).
      # The body is pre-filled from CHANGELOG.md; review the draft before publishing.
      - name: Create draft GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: ${{ steps.channel.outputs.channel == 'preview' }}
          body_path: site/release-notes.md
          files: |
            site/artifacts/*.nupkg
            site/artifacts/npm/site/*.tgz
