# Pull-request and main-branch verification.
#
# Until this workflow existed, release.yml was the repository's only CI: nothing was built, tested
# or checked until someone pushed a version tag, at which point a failure is discovered on the
# release path with a tag already cut. abp-modules hit the same shape of problem from the other
# direction - `flex-fields-ckeditor` was built by its release workflow but not its CI, so a pull
# request that broke the CKEditor adapter stayed green until tag time (fixed in that repository's
# 10.0.0-rc.13).
#
# This file deliberately mirrors release.yml's verification steps and stops there: no packing, no
# publishing, no NuGet/npm credentials. When a step here and its counterpart there drift apart, the
# one there is the one that gates a release and wins.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# A second push to the same pull request makes the first run's answer irrelevant, and these jobs are
# long enough (full .NET build plus two Angular builds) to be worth reclaiming a runner for.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    # Both checkouts land as siblings under $GITHUB_WORKSPACE (site/, abp-modules/) rather than a
    # bare checkout at the workspace root, so every `run:` below reads as if it starts from the
    # repository root - same arrangement as release.yml.
    defaults:
      run:
        working-directory: site

    permissions:
      contents: read
      packages: read # @dignite/* aliases to abp-modules' private GitHub Packages as of rc.16 - see below

    # angular/.npmrc maps the @dignite-projects scope to GitHub Packages and references
    # ${GITHUB_TOKEN} for it. Yarn Classic substitutes every env-var placeholder in its resolved
    # config on every invocation and throws when one is unset - including the `yarn cache dir`
    # probe setup-node runs for `cache: yarn`, which happens before any run: step of this job. So
    # it has to be job-level, not set on the install step - exactly as release.yml already does.
    #
    # @dignite/ng.flex-fields (and its -ckeditor/-file-explorer adapters, and @dignite/ng.file-
    # explorer) started resolving through that scope as of 10.0.0-rc.16 - release.yml's copy of this
    # comment carries the full account (why, the alias mechanism, the one-time "Manage Actions
    # access" grant this also depends on, and what to revert once it's no longer needed).
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout site
        uses: actions/checkout@v5
        with:
          path: site

      # Several Dignite.Site .NET projects carry relative ProjectReferences into the sibling
      # abp-modules repository for FlexFields / FileExplorer (see Dignite.Site.slnx's
      # "/flex-fields/" folder). A single-repo checkout has no such directory, so restore and build
      # would fail without this. Both repositories are public, so the default token suffices.
      #
      # The Angular side does NOT need this checkout: angular/package.json resolves the @dignite/*
      # packages as installed npm packages (see angular/.npmrc), not from local file: paths into
      # this sibling.
      - name: Checkout abp-modules (sibling dependency for FlexFields / FileExplorer)
        uses: actions/checkout@v5
        with:
          repository: dignite-projects/abp-modules
          path: abp-modules

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Dignite.Site.slnx

      - name: Build
        run: dotnet build Dignite.Site.slnx --no-restore --configuration Release

      # Enumerated rather than `dotnet test Dignite.Site.slnx`: the solution also carries
      # abp-modules' own projects (checked out above only so they can be referenced), and running
      # their tests here would report another repository's failures as this one's.
      - name: Run domain tests
        run: dotnet test test/Dignite.Site.Domain.Tests/Dignite.Site.Domain.Tests.csproj --no-build --configuration Release --verbosity normal

      - name: Run application tests
        run: dotnet test test/Dignite.Site.Application.Tests/Dignite.Site.Application.Tests.csproj --no-build --configuration Release --verbosity normal

      - name: Run EF Core tests
        run: dotnet test test/Dignite.Site.EntityFrameworkCore.Tests/Dignite.Site.EntityFrameworkCore.Tests.csproj --no-build --configuration Release --verbosity normal

      - name: Run MongoDB tests
        run: dotnet test test/Dignite.Site.MongoDB.Tests/Dignite.Site.MongoDB.Tests.csproj --no-build --configuration Release --verbosity normal

      - name: Run HttpApi.Client tests
        run: dotnet test test/Dignite.Site.Public.HttpApi.Client.Tests/Dignite.Site.Public.HttpApi.Client.Tests.csproj --no-build --configuration Release --verbosity normal

      # Not currently run by release.yml either - the standing MCP-tool/DTO contract test that
      # fails when an MCP tool's parameters drift from the Create/Update/List DTO it builds. It is
      # the check that would have caught create_page/update_page silently dropping `template`.
      - name: Run MCP tests
        run: dotnet test test/Dignite.Site.Mcp.Tests/Dignite.Site.Mcp.Tests.csproj --no-build --configuration Release --verbosity normal

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: yarn
          cache-dependency-path: site/angular/yarn.lock

      # Yarn with the committed lockfile, matching release.yml and every developer machine, so the
      # tree verified here is the one the lockfile actually describes rather than a fresh resolution
      # that ignores it. --frozen-lockfile additionally fails if a package.json change was committed
      # without its lockfile update.
      #
      # release.yml used to install with npm here, because Yarn Classic fetched a dependency whose
      # lockfile entry carried a GitHub Packages "resolved" URL through a code path that never
      # attached registry auth. That was fixed and both workflows ran the same yarn command against
      # public-npmjs-only @dignite/* packages for a while - but as of 10.0.0-rc.16, @dignite/*
      # aliases back onto GitHub Packages (see the job-level env: block's comment above), so this
      # repeats the original gotcha's shape if that auth ever regresses. release.yml's step carries
      # the longer account.
      #
      # It matters for the duplicate check below specifically: npm dedupes graphs that Yarn Classic
      # splits into nested copies, so running that check after an npm install would pass vacuously.
      - name: Install Angular dependencies
        working-directory: site/angular
        run: yarn install --frozen-lockfile --non-interactive

      # Two copies of one Angular library are two sets of module-scoped InjectionToken values, so
      # providers registered against one are invisible to consumers of the other - the field type
      # simply is not there at runtime, with nothing failing at install or build time. See the
      # script's own header and dignite-projects/abp-modules#211.
      #
      # The targets are the libraries whose duplication would silently break DI at runtime, not
      # "everything installed":
      #   @dignite-projects - the original case (FLEX_FIELD_TYPES split across two copies), targeted
      #                   under this scope rather than @dignite because angular/package.json aliases
      #                   ng.flex-fields (etc.) to "npm:@dignite-projects/...@<range>" as of rc.16
      #                   (see the job-level env: block's comment) - the installed manifests'
      #                   "name" field is the real @dignite-projects/* identity regardless of which
      #                   alias imported them, and that identity is what this check matches on.
      #   @abp          - CORE_OPTIONS, ConfigStateService, the environment tokens; every ABP
      #                   package in the tree peers on @abp/ng.core and would split with it.
      #   ng-zorro-antd - unscoped, so the old scope-only invocation could not see it at all, and a
      #                   live near-miss: @abp/ng.components pins it `~21.0.0-next.1` (< 21.1.0)
      #                   while angular/projects/site/package.json asks `^21.0.2` (any 21.x). The
      #                   root currently resolves to 21.0.2 so nothing is nested yet; the first
      #                   21.1 release would nest a second copy under @abp/ng.components, giving
      #                   two NZ_CONFIG tokens and two NzConfigService instances.
      #   @angular/*    - core/common/forms/router/cdk, enumerated rather than taken as the whole
      #                   @angular scope: those five are what angular/projects/site/package.json
      #                   declares (cdk as a dependency, the rest as peers) and what ships in a
      #                   consumer's bundle. The scope also holds build tooling (@angular/build,
      #                   @angular/cli, @angular/compiler-cli, @angular/language-service) where a
      #                   nested second copy is ordinary and harmless, and would only teach people
      #                   to ignore this check.
      # Deliberately out: tslib, which genuinely IS installed twice here (2.8.1 at the root, 1.14.1
      # nested under tsyringe) and is fine that way - it is stateless inline helpers, no tokens, no
      # identity. rxjs is a borderline case (two copies break `instanceof Observable`, not DI) left
      # out for now because it is universally deduped by every consumer.
      #
      # Keep this list and release.yml's identical.
      - name: Check for duplicate Angular packages
        working-directory: site/angular
        run: |
          node ../.github/scripts/check-angular-package-duplicates.mjs node_modules \
            @dignite-projects @abp ng-zorro-antd \
            @angular/core @angular/common @angular/forms @angular/router @angular/cdk

      # No lint step, matching release.yml: `ng lint site` currently fails on ~14 pre-existing
      # violations (component selector prefixes, ngIf vs. control-flow syntax). Fixing those is real
      # work, not CI plumbing; adding the step before that happens would only make every pull
      # request red.
      - name: Run site Angular library unit tests
        working-directory: site/angular
        run: yarn ng test site --watch=false

      - name: Build site Angular library
        working-directory: site/angular
        run: yarn build:site

      # Two checks over the built dist/site manifest, both answering "can a consumer who installs
      # this actually build?":
      #
      #   1. Every emitted import is declared. ng-packagr emits an external for every bare specifier
      #      it does not bundle, but never checks that the external is declared.
      #   2. Every non-optional peer required across dist/site's transitive `dependencies` closure is
      #      either inside that closure or in dist/site's own `peerDependencies`. Consumers install
      #      with --legacy-peer-deps (@abp/ng.theme.shared pins @swimlane/ngx-datatable@~22, whose
      #      Angular peer range stops at 20), and npm installs no peers at all under that flag - at
      #      any depth. So a peer declared by a transitive dependency is simply absent unless
      #      something pulls it in as a real dependency or the host already has it.
      #
      # Check 2 is the one this repository learned the hard way. 0.1.0-preview.10 shipped with
      # @dignite/ng.flex-fields emitting `from '@abp/ng.components/tree'` while declaring
      # @abp/ng.components as a *peer*, and @dignite/ng.site naming it in neither list: the published
      # package bundled to `Could not resolve "@abp/ng.components/tree"`. Check 1 was blind to it -
      # the specifier is flex-fields', not this package's, and flex-fields did declare it, just in the
      # list --legacy-peer-deps ignores. Running here means the next one is a red pull request rather
      # than a bad release.
      #
      # Needs both dist/site (the build step above) and an installed node_modules, which it finds by
      # walking up from the dist directory - hence no extra argument to keep in sync with release.yml.
      - name: Check site Angular package dependencies
        working-directory: site/angular
        run: node ../.github/scripts/check-angular-package-deps.mjs dist/site

      # The Host app is what actually exercises provideSite() end to end - the library build above
      # compiles the sources but never resolves the field-type registrations through DI.
      - name: Build Host application
        working-directory: site/angular
        run: yarn build
